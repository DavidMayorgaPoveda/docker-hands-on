services:
  mongo:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db
      - ./mongo/init.json:/docker-entrypoint-initdb.d/init.json:ro
      - ./mongo/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - movie-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/movies_db
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - movie-net

  frontend:
    build: ./frontend
    ports:
      - "8181:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - movie-net

networks:
  movie-net:
    driver: bridge

volumes:
  mongo-data:
