name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'step4_movie-app/backend/**'
      - 'step4_movie-app/Makefile'
      - '.github/workflows/backend-ci.yml'
  push:
    paths:
      - 'step4_movie-app/backend/**'
      - 'step4_movie-app/Makefile'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend tests and image build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run backend tests
        id: backend_tests
        run: make -C step4_movie-app test-backend

      - name: Build backend image
        run: docker build --tag movie-explorer-backend:ci --file step4_movie-app/backend/Dockerfile step4_movie-app/backend

      - name: Upload backend test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            step4_movie-app/backend/junit.xml
            step4_movie-app/backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14
